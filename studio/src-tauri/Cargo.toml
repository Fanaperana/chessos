[package]
name = "chessos-studio"
version = "0.1.0"
description = "Build and flash single-app handheld OS images (R36S, Anbernic, ArkOS family)"
authors = ["Fanaperana"]
license = "MIT"
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
ureq = "2"
xz2 = { version = "0.1", features = ["static"] }
fatfs = "0.3"
fscommon = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
color_quant = "1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
